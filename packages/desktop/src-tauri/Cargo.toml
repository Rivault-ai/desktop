[package]
name = "rivault-desktop"
version = "0.3.4"
description = "Rivault Desktop daemon — deterministic local plaintext redaction"
authors = ["Rivault"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables right-click -> Inspect Element on release builds.
# v0 is open-source so there's nothing to hide; revisit before v1.
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"

sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
urlencoding = "2"
url = "2"
subtle = "2"
rand = "0.8"
libc = "0.2"

# Envelope crypto for L2 vault items (P-256 ECDH + HKDF-SHA256 + AES-256-GCM)
# matching `packages/api/src/lib/envelope.ts` on the Rivault backend.
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
hkdf = "0.12"
aes-gcm = "0.10"

# Local MCP server hosted inside the daemon. Agents (Claude Code, Codex,
# Claude Desktop, OpenClaw) point at 127.0.0.1:<port>/mcp instead of the
# cloud-hosted Rivault MCP, so the daemon is the only place that ever
# sees plaintext.
rmcp = { version = "1.6", features = [
  "server",
  "macros",
  "schemars",
  "transport-streamable-http-server",
  "tower",
] }
schemars = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
once_cell = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
eventsource-stream = "0.2"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
strip = true
